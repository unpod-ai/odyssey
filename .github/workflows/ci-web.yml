name: ci-web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "sdk/javascript/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "sdk/javascript/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-web.yml"

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies (whole workspace — apps/web depends on @odyssey/sdk)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build (also type-checks and prerenders every route)
        run: pnpm build
