name: ci-eval

on:
  push:
    branches: [main]
    paths:
      - "evaluation/**"
      - "packages/odyssey-core/**"
      - "data_preparation/**"
      - ".github/workflows/ci-eval.yml"
  pull_request:
    paths:
      - "evaluation/**"
      - "packages/odyssey-core/**"
      - "data_preparation/**"
      - ".github/workflows/ci-eval.yml"

defaults:
  run:
    working-directory: evaluation

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies (whole workspace — this depends on odyssey-core and odyssey-dataprep)
        working-directory: .
        run: uv sync --all-packages --extra dev

      - name: isort (check only)
        run: uv run --extra dev isort --check-only .

      - name: black (check only)
        run: uv run --extra dev black --check .

      - name: flake8
        run: uv run --extra dev flake8 --max-line-length=88 --extend-ignore=E203,E501,W503,F541,F841 src tests

      - name: pyrefly
        run: uv run --extra dev pyrefly check

      - name: tests
        run: uv run pytest tests
