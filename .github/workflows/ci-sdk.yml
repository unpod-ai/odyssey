name: ci-sdk

# docs/STRUCTURE.md names this "sdk/** (py + js matrix)" — only the Python
# leg exists today (sdk/python, item 8.4); add a js job here the same
# commit sdk/javascript (item 8.5) lands, rather than a second workflow.

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "packages/odyssey-schemas/**"
      - "services/api/**"
      - ".github/workflows/ci-sdk.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - "packages/odyssey-schemas/**"
      - "services/api/**"
      - ".github/workflows/ci-sdk.yml"

defaults:
  run:
    working-directory: sdk/python

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies (whole workspace — depends on odyssey-schemas, odyssey-api for tests)
        working-directory: .
        run: uv sync --all-packages --extra dev

      - name: isort (check only)
        run: uv run --extra dev isort --check-only .

      - name: black (check only)
        run: uv run --extra dev black --check .

      - name: flake8
        run: uv run --extra dev flake8 --max-line-length=88 --extend-ignore=E203,E501,W503,F541,F841 src tests

      - name: pyrefly
        run: uv run --extra dev pyrefly check

      - name: tests
        run: uv run pytest tests
