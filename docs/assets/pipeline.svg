<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Odyssey Data Flow Architecture</title>
  <desc id="desc">Animated architecture diagram showing the exact observability inputs and training outputs from the README reference flowing through Odyssey core.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#fff7ef"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#eef2ff" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="coreFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f3141"/>
      <stop offset="100%" stop-color="#111218"/>
    </linearGradient>
    <linearGradient id="leftStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8dff"/>
      <stop offset="100%" stop-color="#8db6ff"/>
    </linearGradient>
    <linearGradient id="rightStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb067"/>
      <stop offset="100%" stop-color="#ff8a33"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#b7c0d6" flood-opacity="0.28"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#d7dee9" flood-opacity="0.35"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e8e4dc"/>
    </pattern>
    <marker id="arrowRightBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#5b94ff"/>
    </marker>
    <marker id="arrowRightOrange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ff943c"/>
    </marker>
  </defs>

  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; }
    .title { font-size: 28px; font-weight: 800; fill: #1b1d26; }
    .caption { font-size: 14px; fill: #7b8193; }
    .section { font-size: 18px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
    .pill { fill: #ffffff; stroke: #e7e6e2; stroke-width: 1.2; }
    .pillText { font-size: 14px; font-weight: 700; }
    .panel { fill: url(#halo); stroke: #ece9e2; stroke-width: 1.4; }
    .card { fill: #ffffff; stroke: #e7eaf0; stroke-width: 1.4; rx: 20; }
    .leftCardAccent { fill: #4f8dff; }
    .rightCardAccent { fill: #ff9b4a; }
    .cardTitle { font-size: 24px; font-weight: 700; fill: #2a2e3b; }
    .cardSub { font-size: 16px; fill: #9aa1b2; }
    .smallTitle { font-size: 20px; font-weight: 700; fill: #2a2e3b; }
    .coreLabel { font-size: 14px; font-weight: 700; letter-spacing: 2.4px; fill: #d2d5de; text-transform: uppercase; }
    .coreText { font-size: 72px; font-weight: 800; fill: #ffffff; }
    .coreSub { font-size: 18px; font-weight: 500; fill: #b9bfce; }
    .foundationTag { fill: #ffffff; stroke: #e3e5eb; stroke-width: 1.1; rx: 20; }
    .foundationTagText { font-size: 15px; font-weight: 700; fill: #72798b; letter-spacing: 0.9px; text-transform: uppercase; }
    .platformTitle { font-size: 28px; font-weight: 800; fill: #2d313f; }
    .platformSub { font-size: 18px; fill: #8b90a0; }
    .boxedPill { fill: #eafaf0; stroke: #bce7ca; stroke-width: 1; rx: 12; }
    .boxedText { font-size: 16px; font-weight: 800; fill: #27a167; letter-spacing: 1px; }
    .legend { font-size: 13px; fill: #8d92a1; }
    .footer { font-size: 14px; fill: #9aa0af; }
    .flowLeft, .flowRight {
      fill: none;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-dasharray: 10 10;
      opacity: 0.95;
    }
    .flowLeft {
      stroke: #76a8ff;
      animation: dashLeft 1.6s linear infinite;
    }
    .flowRight {
      stroke: #ff9d56;
      animation: dashRight 1.6s linear infinite;
    }
    .pulseBlue { fill: #4f8dff; animation: pulseBlue 2.4s ease-in-out infinite; }
    .pulseOrange { fill: #ff9b4a; animation: pulseOrange 2.4s ease-in-out infinite; }
    .glowDot { animation-delay: 0.4s; }
    .coreFloat { animation: floatCore 5s ease-in-out infinite; transform-origin: 700px 386px; }
    .platformFloat { animation: floatPlatform 5s ease-in-out infinite; transform-origin: 700px 610px; }
    @keyframes dashLeft {
      to { stroke-dashoffset: -40; }
    }
    @keyframes dashRight {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pulseBlue {
      0%, 100% { r: 5; opacity: 0.95; }
      50% { r: 10; opacity: 0.28; }
    }
    @keyframes pulseOrange {
      0%, 100% { r: 5; opacity: 0.95; }
      50% { r: 10; opacity: 0.28; }
    }
    @keyframes floatCore {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes floatPlatform {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(4px); }
    }
  </style>

  <rect width="1400" height="860" fill="url(#bg)"/>
  <rect width="1400" height="860" fill="url(#dots)" opacity="0.7"/>

  <text x="700" y="74" text-anchor="middle" class="title">Odyssey - Data Flow Architecture</text>
  <text x="700" y="106" text-anchor="middle" class="caption">Observability signals converge into odyssey core • Foundation layer stores to Data Collection Platform • Training stack consumes downstream</text>

  <g transform="translate(338,132)">
    <rect width="194" height="36" rx="18" class="pill"/>
    <circle cx="18" cy="18" r="4" fill="#4f8dff"/>
    <text x="34" y="23" class="pillText" fill="#5b7fe8">INPUTS • OBSERVABILITY</text>
  </g>
  <g transform="translate(573,132)">
    <rect width="154" height="36" rx="18" fill="#14161d"/>
    <circle cx="18" cy="18" r="4" fill="#ffffff"/>
    <text x="34" y="23" class="pillText" fill="#ffffff">CORE • odyssey</text>
  </g>
  <g transform="translate(758,132)">
    <rect width="194" height="36" rx="18" class="pill"/>
    <circle cx="18" cy="18" r="4" fill="#ff9b4a"/>
    <text x="34" y="23" class="pillText" fill="#ee8d35">OUTPUTS • TRAINING</text>
  </g>

  <rect x="72" y="200" width="1256" height="620" rx="34" class="panel" filter="url(#softShadow)"/>

  <text x="128" y="248" class="section" fill="#4c79e7">INPUTS / OBSERVABILITY STACK</text>
  <text x="970" y="248" class="section" fill="#ee8937">OUTPUTS / TRAINING STACK</text>

  <g filter="url(#cardShadow)">
    <g transform="translate(92,274)">
      <rect width="258" height="72" rx="18" class="card"/>
      <rect x="0" y="15" width="5" height="42" rx="3" class="leftCardAccent"/>
      <text x="48" y="36" class="cardTitle">metrics</text>
      <text x="48" y="57" class="cardSub">OpenTelemetry • Prometheus</text>
      <circle cx="236" cy="36" r="4" fill="#77a7ff"/>
    </g>
    <g transform="translate(92,362)">
      <rect width="258" height="72" rx="18" class="card"/>
      <rect x="0" y="15" width="5" height="42" rx="3" class="leftCardAccent"/>
      <text x="48" y="36" class="cardTitle">traces</text>
      <text x="48" y="57" class="cardSub">Distributed Tracing</text>
      <circle cx="236" cy="36" r="4" fill="#77a7ff"/>
    </g>
    <g transform="translate(92,450)">
      <rect width="258" height="72" rx="18" class="card"/>
      <rect x="0" y="15" width="5" height="42" rx="3" class="leftCardAccent"/>
      <text x="48" y="36" class="cardTitle">langfuse</text>
      <text x="48" y="57" class="cardSub">LLM Observability</text>
      <circle cx="236" cy="36" r="4" fill="#77a7ff"/>
    </g>
    <g transform="translate(92,538)">
      <rect width="258" height="72" rx="18" class="card"/>
      <rect x="0" y="15" width="5" height="42" rx="3" class="leftCardAccent"/>
      <text x="48" y="36" class="cardTitle">langchain</text>
      <text x="48" y="57" class="cardSub">Agent Framework</text>
      <circle cx="236" cy="36" r="4" fill="#77a7ff"/>
    </g>
    <g transform="translate(92,626)">
      <rect width="258" height="72" rx="18" class="card"/>
      <rect x="0" y="15" width="5" height="42" rx="3" class="leftCardAccent"/>
      <text x="48" y="36" class="cardTitle">pipecat</text>
      <text x="48" y="57" class="cardSub">Voice Pipeline</text>
      <circle cx="236" cy="36" r="4" fill="#77a7ff"/>
    </g>
    <g transform="translate(92,714)">
      <rect width="258" height="72" rx="18" class="card"/>
      <rect x="0" y="15" width="5" height="42" rx="3" class="leftCardAccent"/>
      <text x="48" y="36" class="cardTitle">livekit</text>
      <text x="48" y="57" class="cardSub">Realtime Transport</text>
      <circle cx="236" cy="36" r="4" fill="#77a7ff"/>
    </g>
    <g transform="translate(1050,274)">
      <rect width="258" height="72" rx="18" class="card"/>
      <rect x="253" y="15" width="5" height="42" rx="3" class="rightCardAccent"/>
      <text x="28" y="36" class="cardTitle">hugging face</text>
      <text x="28" y="57" class="cardSub">Model Hub • Datasets</text>
      <circle cx="236" cy="36" r="4" fill="#ffab63"/>
    </g>
    <g transform="translate(1050,404)">
      <rect width="258" height="72" rx="18" class="card"/>
      <rect x="253" y="15" width="5" height="42" rx="3" class="rightCardAccent"/>
      <text x="28" y="36" class="cardTitle">unsloth</text>
      <text x="28" y="57" class="cardSub">Fast Finetuning</text>
      <circle cx="236" cy="36" r="4" fill="#ffab63"/>
    </g>
    <g transform="translate(1050,534)">
      <rect width="258" height="72" rx="18" class="card"/>
      <rect x="253" y="15" width="5" height="42" rx="3" class="rightCardAccent"/>
      <text x="28" y="36" class="cardTitle">bedrock</text>
      <text x="28" y="57" class="cardSub">AWS Bedrock</text>
      <circle cx="236" cy="36" r="4" fill="#ffab63"/>
    </g>
    <g transform="translate(1050,664)">
      <rect width="258" height="72" rx="18" class="card" stroke="#ffc58e" stroke-dasharray="6 6"/>
      <rect x="0" y="16" width="40" height="40" rx="12" fill="#ff6f1f"/>
      <circle cx="20" cy="36" r="9" fill="#ffffff" opacity="0.2"/>
      <circle cx="20" cy="36" r="4" fill="#ffffff"/>
      <text x="58" y="34" class="smallTitle">other data training models</text>
      <text x="58" y="56" class="cardSub">Custom Training Loop</text>
      <circle cx="236" cy="36" r="4" fill="#ffab63"/>
    </g>
  </g>

  <g class="coreFloat" filter="url(#softShadow)">
    <rect x="462" y="318" width="476" height="228" rx="92" fill="url(#coreFill)"/>
    <text x="700" y="372" text-anchor="middle" class="coreLabel">CORE ENGINE</text>
    <circle cx="571" cy="363" r="4" fill="#62a0ff"/>
    <circle cx="832" cy="363" r="4" fill="#ff9b4a"/>
    <circle cx="875" cy="363" r="4" fill="#4ae18b"/>
    <text x="700" y="433" text-anchor="middle" class="coreText">odyssey</text>
    <text x="700" y="480" text-anchor="middle" class="coreSub">Data Orchestration  •  Real-time Flow</text>
  </g>

  <g transform="translate(610,548)">
    <rect width="180" height="34" rx="17" class="foundationTag"/>
    <circle cx="18" cy="17" r="4" fill="#33353e"/>
    <text x="32" y="22" class="foundationTagText">Foundation Layer</text>
  </g>

  <g class="platformFloat" filter="url(#cardShadow)">
    <rect x="500" y="584" width="400" height="124" rx="20" class="card" stroke-dasharray="4 6"/>
    <rect x="520" y="612" width="44" height="44" rx="12" fill="#14161d"/>
    <rect x="532" y="623" width="20" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
    <text x="585" y="628" class="platformTitle">Data Collection Platform</text>
    <text x="585" y="657" class="platformSub">Central Intake • Cold + Hot Store</text>
    <rect x="760" y="631" width="78" height="30" class="boxedPill"/>
    <text x="778" y="651" class="boxedText">BOXED</text>
    <rect x="867" y="636" width="24" height="10" rx="5" fill="#14161d"/>
  </g>

  <path d="M350 310 C430 320, 468 355, 492 390" class="flowLeft" marker-end="url(#arrowRightBlue)"/>
  <path d="M350 398 C430 402, 470 398, 492 402" class="flowLeft" marker-end="url(#arrowRightBlue)"/>
  <path d="M350 486 C432 492, 470 434, 492 416" class="flowLeft" marker-end="url(#arrowRightBlue)"/>
  <path d="M350 574 C430 580, 470 468, 492 430" class="flowLeft" marker-end="url(#arrowRightBlue)"/>
  <path d="M350 662 C430 648, 474 518, 492 444" class="flowLeft" marker-end="url(#arrowRightBlue)"/>
  <path d="M350 750 C432 712, 500 560, 564 454" class="flowLeft" marker-end="url(#arrowRightBlue)"/>

  <path d="M908 392 C962 352, 1008 314, 1050 310" class="flowRight" marker-end="url(#arrowRightOrange)"/>
  <path d="M908 408 C968 402, 1012 424, 1050 440" class="flowRight" marker-end="url(#arrowRightOrange)"/>
  <path d="M908 426 C970 456, 1015 510, 1050 570" class="flowRight" marker-end="url(#arrowRightOrange)"/>
  <path d="M908 440 C970 520, 1012 624, 1050 700" class="flowRight" marker-end="url(#arrowRightOrange)"/>

  <path d="M700 708 L700 748" class="flowRight" marker-end="url(#arrowRightOrange)"/>

  <circle cx="446" cy="352" r="5" class="pulseBlue"/>
  <circle cx="468" cy="442" r="5" class="pulseBlue glowDot"/>
  <circle cx="472" cy="554" r="5" class="pulseBlue"/>
  <circle cx="468" cy="666" r="5" class="pulseBlue glowDot"/>
  <circle cx="518" cy="606" r="5" class="pulseBlue"/>
  <circle cx="952" cy="362" r="5" class="pulseOrange"/>
  <circle cx="980" cy="482" r="5" class="pulseOrange glowDot"/>
  <circle cx="988" cy="608" r="5" class="pulseOrange"/>
  <circle cx="994" cy="718" r="5" class="pulseOrange glowDot"/>

  <text x="104" y="816" class="legend">Blue = metrics • traces • langfuse • langchain • pipecat • livekit</text>
  <text x="444" y="816" class="legend">Black = odyssey core</text>
  <text x="650" y="816" class="legend">Orange = hugging face • unsloth • bedrock • custom training loops</text>
  <text x="1038" y="816" class="footer">Odyssey • Data Flow Architecture</text>
</svg>
