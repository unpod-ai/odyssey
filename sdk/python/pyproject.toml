[project]
name = "odyssey-sdk"
version = "0.1.0"
description = "Generated Python client for services/api (item 8.4) — resources/ mirror the read API's routes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Unpod", email = "parvinder@unpod.ai" }]

# stdlib urllib only for transport (same discipline odyssey-core's own
# HttpSink already established) + odyssey-schemas for response DTOs, so
# an external consumer of this client pulls in no HTTP framework at all.
# No dependency on odyssey-api itself — this package must be usable by
# someone who only has network access to a deployed services/api, not the
# monorepo.
dependencies = ["odyssey-schemas"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "black==26.3.1",
  "isort>=5.13",
  "flake8>=7.3",
  "pyrefly>=0.1",
  # dev-only: tests spin up a real services/api instance to exercise this
  # client against real HTTP responses, not a fake transport.
  "odyssey-api",
  "uvicorn>=0.30",
]

[project.entry-points."odyssey.commands"]
sdk = "odyssey_sdk.cli:register"

[tool.uv.sources]
odyssey-schemas = { workspace = true }
odyssey-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odyssey_sdk"]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
