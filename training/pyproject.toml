[project]
name = "odyssey-training"
version = "0.1.0"
description = "The soup-cli adapter (item 5.6): translate an odyssey corpus into a soup.yaml training config."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Unpod", email = "parvinder@unpod.ai" }]

# soup-cli, light install only -- no [train] extra. That extra pulls torch,
# transformers, peft, trl, accelerate; this member never trains anything
# itself, it writes a soup.yaml and lets a caller with a GPU run `soup
# train --config` separately. pyyaml because we write that file; both are
# genuine, not phantom -- soup_cli.config.schema.SoupConfig is imported
# directly to validate every config this module writes against soup-cli's
# own real schema, not a hand-guessed one.
dependencies = ["odyssey", "soup-cli>=0.73,<1", "pyyaml>=6"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "black==26.3.1",
  "isort>=5.13",
  "flake8>=7.3",
  "pyrefly>=0.1",
]
# item 5.9 — checkpoints.upload_checkpoint imports boto3 lazily, only when
# no `client` double is injected, so a light install never needs an S3 SDK.
s3 = ["boto3>=1.34"]

[project.entry-points."odyssey.commands"]
train = "odyssey_training.cli:register"
model = "odyssey_training.model_cli:register"

[tool.uv.sources]
odyssey = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odyssey_training"]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
