[project]
name = "odyssey-cli"
version = "0.1.0"
description = "The single `odyssey` console script, plugin-dispatched. See ADR 0003."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Unpod", email = "parvinder@unpod.ai" }]

# typer + rich live here, never in a member. Members declare themselves via
# the "odyssey.commands" entry-point group; this package only discovers and
# dispatches, never imports a member eagerly (see registry.py).
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "odyssey",
  "odyssey-dataprep",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "black==26.3.1",
  "isort>=5.13",
  "flake8>=7.3",
  "pyrefly>=0.1",
]

[project.scripts]
odyssey = "odyssey_cli.main:run"

[tool.uv.sources]
odyssey = { workspace = true }
odyssey-dataprep = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odyssey_cli"]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
