[project]
name = "odyssey-api"
version = "0.1.0"
description = "Read API for journeys/datasets/models/eval-runs — the 'one place' items 8.1-8.3 describe. Ingest stays services/collector's job (see README)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Unpod", email = "parvinder@unpod.ai" }]

# FastAPI is a genuine new dependency here (unlike services/collector, which
# deliberately stayed stdlib — see its README): routing/validation/DTOs/
# OpenAPI generation are exactly the job this service has. odyssey-schemas
# supplies the DTOs; the other three are read-only consumers of registries
# those members already own (datasets/models/eval-sets) — this service does
# not duplicate their write paths, only reads what they wrote.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "odyssey-schemas",
  "odyssey",
  "odyssey-dataprep",
  "odyssey-training",
  "odyssey-eval",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "black==26.3.1",
  "isort>=5.13",
  "flake8>=7.3",
  "pyrefly>=0.1",
]

[project.entry-points."odyssey.commands"]
api = "odyssey_api.cli:register"

[tool.uv.sources]
odyssey = { workspace = true }
odyssey-schemas = { workspace = true }
odyssey-dataprep = { workspace = true }
odyssey-training = { workspace = true }
odyssey-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odyssey_api"]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
