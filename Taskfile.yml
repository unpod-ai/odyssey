# Root delegator. Every member owns its own Taskfile; this file only routes.
# A task appears here once the member it routes to exists — no task that fails
# because its target is still a .gitkeep.

version: "3"

includes:
  core:
    taskfile: ./packages/odyssey-core/Taskfile.yml
    dir: ./packages/odyssey-core
  collector:
    taskfile: ./services/collector/Taskfile.yml
    dir: ./services/collector
  dataprep:
    taskfile: ./data_preparation/Taskfile.yml
    dir: ./data_preparation
  cli:
    taskfile: ./cli/Taskfile.yml
    dir: ./cli
  training:
    taskfile: ./training/Taskfile.yml
    dir: ./training

vars:
  UV:
    sh: command -v uv 2>/dev/null || echo "${HOME}/.local/bin/uv"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  setup:
    desc: Sync the whole python workspace (all members, one lockfile)
    cmds:
      - "{{.UV}} sync --all-packages --extra dev"

  check:
    desc: fmt + lint + types + tests across every member
    cmds:
      - task: core:check
      - task: collector:check
      - task: dataprep:check
      - task: cli:check
      - task: training:check

  test:
    desc: Run every member's test suite
    cmds:
      - task: core:test
      - task: collector:test
      - task: dataprep:test
      - task: cli:test
      - task: training:test
