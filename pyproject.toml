# uv workspace root — virtual, deliberately no [project] table.
#
# Nothing is installed from the root; it exists to give every member one resolver
# run and one lockfile (uv.lock). Members are listed explicitly rather than by
# glob: a directory that is scaffolded but has no pyproject.toml yet would break
# `uv sync` if a glob picked it up.
#
[tool.uv.workspace]
members = ["packages/odyssey-core", "packages/odyssey-schemas", "services/collector", "services/api", "data_preparation", "cli", "training", "evaluation", "sdk/python"]
