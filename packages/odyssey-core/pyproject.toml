[project]
name = "odyssey"
version = "0.1.0"
description = "Training-data framework — agent traces in, training corpora out."
readme = "README.md"
# Upper bound is load-bearing, not caution. Soup (soup-cli, the trainer adapter
# this project is built around) pins >=3.10,<3.13 and enforces it with a test
# that parses its own CI matrix. The super workspace is >=3.12. The intersection
# is exactly 3.12. See openspec/changes/add-journey-schema/design.md.
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Unpod", email = "parvinder@unpod.ai" }]

# Deliberately empty. The ported schema (src/odyssey/primitives.py) and builders
# (src/odyssey/builders/) import only json + typing + dataclasses — verified against
# the upstream tree. The spool and the JSONL codec are stdlib. Adding a
# dependency nothing imports is a phantom dep; the change that needs one adds it.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "black==26.3.1",
  "isort>=5.13",
  "flake8>=7.3",
  "pyrefly>=0.1",
]
# Provider capture. `odyssey.integrations.anthropic` imports the SDK inside the
# wrapper's __init__, never at module scope, so `import odyssey` stays
# dependency-free and only code that touches the integration needs this extra.
anthropic = ["anthropic>=0.40"]
# Same shape, same reasoning. Also covers OpenAI-compatible providers (Groq,
# Together, local vLLM/Ollama, ...) — they're driven through this same SDK
# with a different base_url, not a separate client.
openai = ["openai>=1.0"]
# `odyssey.integrations.langchain` (item 0.10) imports this inside
# OdysseyCallbackHandler(), never at module scope -- same discipline as
# anthropic/openai above.
langchain = ["langchain-core>=0.3"]
# `odyssey.integrations.gemini` (item 0.9) imports this inside Client.__init__,
# never at module scope -- same discipline as anthropic/openai above.
gemini = ["google-genai>=1.0"]
# `odyssey.integrations.otel` (items 0.11/0'.3) imports this inside
# OdysseySpanProcessor(), never at module scope -- same discipline as above.
otel = ["opentelemetry-sdk>=1.20"]

# ADR 0003: cli/ owns the `odyssey` console script; core registers a plugin
# instead of declaring its own [project.scripts]. `register` is called with a
# fresh typer sub-app only when the `spool` command group is dispatched — see
# odyssey.cli.register's docstring. `python -m odyssey.cli` remains the
# documented standalone path (core's own argparse parser, zero deps).
[project.entry-points."odyssey.commands"]
spool = "odyssey.cli:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odyssey"]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Item 9.10: `tests/` is now checked, not just `src`/`scripts`. Re-verified
# 2026-08-28 against pyrefly 1.2.0 that the 157 "narrowing gap" errors an
# earlier pyrefly run reported (`docs/WORKING.md` item 9.10's own history)
# no longer reproduce — `pyrefly check src tests scripts` is 0 errors on
# this codebase today. Whatever combination of pyrefly version and
# accumulated `assert x is not None`-adjacent code changes fixed them, the
# gap that made this a deliberate scope decision rather than a bug is gone;
# closing it here rather than leaving `tests/` unchecked on a stale premise.
[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
