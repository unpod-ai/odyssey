[project]
name = "odyssey-dataprep"
version = "0.1.0"
description = "data_preparation stages, starting with normalization: raw traces -> canonical Journey artifacts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Unpod", email = "parvinder@unpod.ai" }]

# The engine already exists in odyssey-core (fold(), builders/messages.py);
# this member is the stage wrapper over it, not new parsing logic. pyyaml is
# this member's own — recipes/*.yaml (item 3.9) has no reason to touch
# odyssey-core, which stays dependency-free per ADR 0001.
dependencies = ["odyssey", "pyyaml>=6"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "black==26.3.1",
  "isort>=5.13",
  "flake8>=7.3",
  "pyrefly>=0.1",
]
# item 1.10 — collect_from_object_store imports boto3 lazily, only when no
# `client` double is injected, so a light install never needs an S3 SDK.
s3 = ["boto3>=1.34"]
# item 3.5 — paraphrase_journey/generate_synthetic_negative need an LLM in
# the loop; a real client (an `openai.OpenAI`-shaped `.chat.completions
# .create()`) is caller-injected, so this extra is a convenience for
# building one, never imported unless a caller actually asks for it.
llm = ["openai>=1.0"]

[project.entry-points."odyssey.commands"]
data = "odyssey_dataprep.cli:register"

[tool.uv.sources]
odyssey = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odyssey_dataprep"]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
